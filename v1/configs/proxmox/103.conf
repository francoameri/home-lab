# /etc/pve/lxc/103.conf  -- Samba (unprivileged LXC, per-container firewall on)
arch: amd64
cores: 1
features: nesting=1
hostname: samba.lab.lan
memory: 128
nameserver: 10.0.0.201
net0: name=eth0,bridge=vmbr1,firewall=1,gw=10.0.0.1,hwaddr=BC:24:11:02:69:B3,ip=10.0.0.202/24,type=veth
onboot: 1
ostype: debian
rootfs: ssd-thin:vm-103-disk-0,size=5G
searchdomain: lab.lan
swap: 128
unprivileged: 1
