# /etc/pve/lxc/101.conf  -- BIND9 (unprivileged LXC)
arch: amd64
cores: 1
features: nesting=1
hostname: bind9.lab.lan
memory: 128
net0: name=eth0,bridge=vmbr1,gw=10.0.0.1,hwaddr=BC:24:11:38:F1:E4,ip=10.0.0.201/24,type=veth
onboot: 1
ostype: debian
rootfs: ssd-thin:vm-101-disk-0,size=4G
swap: 128
unprivileged: 1
