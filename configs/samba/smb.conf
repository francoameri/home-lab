# /etc/samba/smb.conf
# Only the [shared] block below was customized. Everything else in this file
# was left at Debian's shipped defaults (global settings, [homes], [printers],
# [print$]) and is omitted here for clarity -- see Samba.md.

#======================= Share Definitions =======================

[shared]
   path = /amerinfra/storage
   browseable = yes
   read only = no
   valid users = fameri

# Relevant non-default globals that were kept:
#   server role = standalone server
#   unix password sync = yes      (SMB password kept in sync with the Unix account)
#   map to guest = bad user
